name: Build Docker Image and Export TAR

on:
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker (anonymous)
        run: echo "Skipping Docker login since this is a local build"

      - name: Build Docker image
        run: docker build -t evepraisal:latest .

      - name: Save Docker image to tar
        run: |
          mkdir -p output
          docker save evepraisal:latest -o output/evepraisal.tar

      - name: Upload TAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: evepraisal-tar
          path: output/evepraisal.tar
